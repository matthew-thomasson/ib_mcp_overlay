services:
  option_chain_mcp:
    build:
      context: ./option_chain_mcp
    image: ib_option_chain_mcp:local
    container_name: option_chain_mcp
    environment:
      IB_HOST: ${IB_HOST:-host.docker.internal}
      IB_PORT: ${IB_PORT:-7497}
      IB_CLIENT_ID: ${IB_CLIENT_ID:-21}
      IB_MCP_TRANSPORT: ${IB_MCP_TRANSPORT:-http}
      IB_MCP_HTTP_HOST: ${IB_MCP_HTTP_HOST:-0.0.0.0}
      IB_MCP_HTTP_PORT: ${IB_MCP_HTTP_PORT:-8010}
    ports:
      - "${IB_MCP_HTTP_PORT:-8010}:${IB_MCP_HTTP_PORT:-8010}"
    restart: unless-stopped
